spring:
  application:
    name: nexou

  # Carga las variables del archivo .env local (si existe)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Pool de conexiones (Neon/Supabase free tier: pocas conexiones)
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

server:
  port: ${PORT:8080}

# Configuración de OpenAPI (SpringDoc)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Configuración de Scalar API Reference
scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
