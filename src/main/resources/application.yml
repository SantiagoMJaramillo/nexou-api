spring:
  application:
    name: nexou

  # Carga las variables del archivo .env local (si existe)
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Pool de conexiones (Neon/Supabase free tier: pocas conexiones)
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      "[hibernate.format_sql]": true

server:
  port: ${PORT:8080}

# Configuración de OpenAPI (SpringDoc)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Configuración de Scalar API Reference
scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar

# Seguridad y despliegue (todo se configura con variables de entorno)
app:
  jwt:
    secret: ${JWT_SECRET:}            # mínimo 32 caracteres; obligatorio en producción
    expiracion-horas: ${JWT_HORAS:24}
  admin:
    usuario: ${ADMIN_USER:admin}
    contrasena: ${ADMIN_PASSWORD:}
  cors:
    origenes: ${CORS_ORIGENES:*}      # ej: https://mi-app.vercel.app,http://localhost:5173
